<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Point Cloud Viewer - COLMAP PLY</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
        }
        .btn-file {
            display: block;
            width: 100%;
            padding: 10px 14px;
            background: #0284c7;
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: none;
        }
        .btn-file:hover {
            background: #0369a1;
        }
        #file-input {
            display: none;
        }
        #drop-zone {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            border: 3px dashed #38bdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        #drop-zone.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #stats {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .stat-value {
            color: #f1f5f9;
            font-weight: 500;
        }
    </style>

    <!-- Import Three.js & Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
</head>
<body>

    <div id="drop-zone">
        <h1 style="color: #38bdf8; margin-bottom: 10px;">Kéo & Thả file points3D.ply vào đây</h1>
        <p style="color: #94a3b8; margin-bottom: 20px;">Hoặc bấm nút bên dưới để chọn file từ máy tính</p>
        <button class="btn-file" style="width: auto; padding: 12px 24px;" onclick="document.getElementById('file-input').click()">Chọn File .PLY</button>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>✨ 3D Point Cloud Viewer</h2>
        
        <div class="control-group">
            <label for="file-input" class="btn-file">📂 Chọn File .PLY khác</label>
            <input type="file" id="file-input" accept=".ply">
        </div>

        <div class="control-group">
            <label for="point-size">Kích thước điểm (Point Size): <span id="size-val">0.05</span></label>
            <input type="range" id="point-size" min="0.001" max="0.5" step="0.002" value="0.05">
        </div>

        <div class="control-group">
            <label for="bg-color">Màu nền canvas</label>
            <input type="color" id="bg-color" value="#0f172a" style="width:100%; height:32px; border-radius:6px; border:none; cursor:pointer;">
        </div>

        <div id="stats">
            <div class="stat-item"><span>Trạng thái:</span> <span class="stat-value" id="status-text">Chờ nạp file...</span></div>
            <div class="stat-item"><span>Số lượng điểm:</span> <span class="stat-value" id="point-count">0</span></div>
        </div>
    </div>

    <script>
        // Setup Three.js Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        let pointCloudMesh = null;

        // Load PLY Data
        const loader = new THREE.PLYLoader();

        function loadPLYBuffer(arrayBuffer) {
            document.getElementById('status-text').textContent = "Đang xử lý...";
            try {
                const geometry = loader.parse(arrayBuffer);
                
                if (pointCloudMesh) {
                    scene.remove(pointCloudMesh);
                    pointCloudMesh.geometry.dispose();
                    pointCloudMesh.material.dispose();
                }

                // Center geometry
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.center();

                const count = geometry.attributes.position ? geometry.attributes.position.count : 0;
                document.getElementById('point-count').textContent = count.toLocaleString();

                // Material for Point Cloud
                const size = parseFloat(document.getElementById('point-size').value);
                const material = new THREE.PointsMaterial({
                    size: size,
                    vertexColors: geometry.attributes.color !== undefined,
                    sizeAttenuation: true
                });

                pointCloudMesh = new THREE.Points(geometry, material);
                scene.add(pointCloudMesh);

                // Adjust camera
                const boundingSphere = geometry.boundingSphere;
                const radius = boundingSphere ? boundingSphere.radius : 5;
                camera.position.set(0, 0, radius * 2.5);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();

                document.getElementById('status-text').textContent = "Hoàn tất!";
                document.getElementById('drop-zone').classList.add('hidden');
            } catch (err) {
                console.error(err);
                alert("Lỗi nạp file PLY: " + err.message);
                document.getElementById('status-text').textContent = "Lỗi!";
            }
        }

        // File input change
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => loadPLYBuffer(evt.target.result);
                reader.readAsArrayBuffer(file);
            }
        });

        // Drag & Drop
        const dropZone = document.getElementById('drop-zone');
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => loadPLYBuffer(evt.target.result);
                reader.readAsArrayBuffer(file);
            }
        });

        // UI Controls
        document.getElementById('point-size').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('size-val').textContent = val;
            if (pointCloudMesh) {
                pointCloudMesh.material.size = val;
                pointCloudMesh.material.needsUpdate = true;
            }
        });

        document.getElementById('bg-color').addEventListener('input', (e) => {
            scene.background = new THREE.Color(e.target.value);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
